name: CMSNApp
options:
  bundleIdPrefix: com.earnyourcmsn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
  configs:
    Debug:
      # Xcode's own project template sets this for Debug by default; a
      # hand-written project.yml doesn't get it for free. Without it, a
      # simulator Debug build resolves both arm64 and x86_64 as valid
      # destination archs for the watchOS simulator target and the new
      # build system tries to merge them into one universal binary via
      # CreateUniversalBinary — which collides with the target's own
      # CopyAndPreserveArchs step on the same output path ("Multiple
      # commands produce .../CMSNWatchApp.app/CMSNWatchApp"). Restricting
      # Debug to the single active arch avoids the merge entirely.
      ONLY_ACTIVE_ARCH: YES

targets:
  CMSNApp:
    type: application
    platform: iOS
    sources:
      - path: CMSNApp
    resources:
      - path: CMSNApp/Resources
    info:
      path: CMSNApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCalendarsUsageDescription: "CMSN checks today's calendar for a scheduled workout (like \"Leg Day\") so it can auto-select your split instead of guessing."
        NSCalendarsFullAccessUsageDescription: "CMSN checks today's calendar for a scheduled workout (like \"Leg Day\") so it can auto-select your split instead of guessing."
        NSHealthShareUsageDescription: "CMSN can read basic health data (like body weight) to keep your training profile current. This is optional and off by default in v0."
        NSHealthUpdateUsageDescription: "CMSN can write completed workouts to Apple Health so they show up alongside your other activity."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: []
        ITSAppUsesNonExemptEncryption: false
    capabilities:
      com.apple.developer.healthkit: {}
      com.apple.InAppPurchase: {}
    dependencies:
      # No explicit `embed: true` here: for a modern single-target watchOS
      # app (type: application.watchapp2), XcodeGen already wires the
      # "Embed Watch Content" copy phase automatically. Adding embed: true
      # on top of that created a second, colliding copy step ("Multiple
      # commands produce .../CMSNWatchApp.app/CMSNWatchApp").
      - target: CMSNWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""

  CMSNWatchApp:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: CMSNWatchApp
    info:
      path: CMSNWatchApp/Info.plist
      properties:
        WKApplication: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "CMSN uses Health data to run and record your workout from your wrist."
        NSHealthUpdateUsageDescription: "CMSN saves your workout to Apple Health when you finish."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO

  CMSNAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CMSNAppTests
    dependencies:
      - target: CMSNApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - CMSNAppTests
      gatherCoverageData: true

schemes:
  CMSNApp:
    build:
      targets:
        CMSNApp: all
        CMSNAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CMSNAppTests
      gatherCoverageData: true

name: CMSNApp
options:
  bundleIdPrefix: com.earnyourcmsn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    # ONLY_ACTIVE_ARCH alone did NOT fix the CMSNWatchApp duplicate-output
    # error (confirmed: identical failure recurred, now surfacing during
    # CreateBuildDescription - i.e. static build-plan construction, before
    # any per-arch compile step runs). That means the conflict is baked
    # into the plan itself, independent of which arch ends up "active" at
    # run time. The actual fix: the watchOS/iOS simulator SDKs advertise
    # both arm64 and x86_64 as valid target archs, and Xcode's new build
    # system plans a CreateUniversalBinary merge step for the watch app's
    # product - which collides with its own CopyAndPreserveArchs step on
    # the same output path. Hosted GitHub macOS runners are Apple Silicon
    # (arm64), so x86_64 simulator slices are never actually needed;
    # excluding them removes the two-arch case entirely.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    "EXCLUDED_ARCHS[sdk=watchsimulator*]": "x86_64"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  CMSNApp:
    type: application
    platform: iOS
    sources:
      - path: CMSNApp
    resources:
      - path: CMSNApp/Resources
    info:
      path: CMSNApp/Info.plist
      properties:
        UILaunchScreen: {}
        NSCalendarsUsageDescription: "CMSN checks today's calendar for a scheduled workout (like \"Leg Day\") so it can auto-select your split instead of guessing."
        NSCalendarsFullAccessUsageDescription: "CMSN checks today's calendar for a scheduled workout (like \"Leg Day\") so it can auto-select your split instead of guessing."
        NSHealthShareUsageDescription: "CMSN can read basic health data (like body weight) to keep your training profile current. This is optional and off by default in v0."
        NSHealthUpdateUsageDescription: "CMSN can write completed workouts to Apple Health so they show up alongside your other activity."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes: []
        ITSAppUsesNonExemptEncryption: false
    capabilities:
      com.apple.developer.healthkit: {}
      com.apple.InAppPurchase: {}
    dependencies:
      # embed: false, explicit. Leaving `embed` unset (the previous state)
      # did NOT avoid the "Multiple commands produce
      # .../CMSNWatchApp.app/CMSNWatchApp" collision - confirmed across
      # three unrelated fix attempts (arch exclusion, ONLY_ACTIVE_ARCH,
      # SKIP_INSTALL) that all left the identical CopyAndPreserveArchs-
      # vs-Ld conflict in place. That means XcodeGen's default for this
      # dependency type is still generating an embed/copy phase for
      # CMSNWatchApp - which a standalone (no WatchKit Extension
      # companion) application.watchapp2 target doesn't need at all in
      # this newer watch-app model: pairing with the host app happens via
      # WKCompanionAppBundleIdentifier in the watch app's own Info.plist,
      # not by physically copying its .app bundle into CMSNApp.app. This
      # dependency only needs to enforce build order, not embedding.
      - target: CMSNWatchApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""

  CMSNWatchApp:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: CMSNWatchApp
    info:
      path: CMSNWatchApp/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.earnyourcmsn.app
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "CMSN uses Health data to run and record your workout from your wrist."
        NSHealthUpdateUsageDescription: "CMSN saves your workout to Apple Health when you finish."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        # SKIP_INSTALL: NO (the previous value) marks this product as
        # independently install-eligible, which triggers an extra
        # "product finalization" CopyAndPreserveArchs step under the new
        # build system for a standalone (no WatchKit Extension companion)
        # application.watchapp2 target - and that step collides with the
        # target's own normal link output at the same path ("Multiple
        # commands produce .../CMSNWatchApp.app/CMSNWatchApp"), confirmed
        # after ruling out arch-multiplicity as the cause (excluding
        # x86_64 from the simulator SDKs did NOT resolve it; the
        # remaining collision was CopyAndPreserveArchs vs. Ld, not
        # CreateUniversalBinary vs. Ld). Apple's own templates set
        # SKIP_INSTALL=YES on companion targets embedded in a host app for
        # exactly this reason - the parent's "Embed Watch Content" copy
        # phase only needs the built artifact, not an install-packaged one.
        SKIP_INSTALL: YES

  CMSNAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CMSNAppTests
    dependencies:
      - target: CMSNApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - CMSNAppTests
      gatherCoverageData: true

schemes:
  CMSNApp:
    build:
      targets:
        CMSNApp: all
        CMSNAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CMSNAppTests
      gatherCoverageData: true

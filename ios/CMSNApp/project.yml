name: CMSNApp
options:
  bundleIdPrefix: com.earnyourcmsn
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Thought Garden Labs LLC. This is the only place the team id is set;
    # targets inherit it. Unsigned simulator CI still passes
    # CODE_SIGNING_ALLOWED=NO and does not sign.
    DEVELOPMENT_TEAM: G2MXBX48PD
    ENABLE_PREVIEWS: YES
    # Standard-practice settings, kept even though none of them turned out
    # to be the actual fix for the CMSNWatchApp "Multiple commands
    # produce" build error (see CMSNApp's dependencies comment below for
    # what the real fix was). Hosted GitHub macOS runners are Apple
    # Silicon (arm64), so the x86_64 simulator slice is never needed.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": "x86_64"
    "EXCLUDED_ARCHS[sdk=watchsimulator*]": "x86_64"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES

targets:
  CMSNApp:
    type: application
    platform: iOS
    sources:
      - path: CMSNApp
        excludes:
          - "**/*.entitlements"
      - path: Shared
    resources:
      # The folder is the resource. Page films live in
      # CMSNApp/Resources/Videos (today, run, nutrition, score, library,
      # settings, meal-builder) and their still frames live in
      # Assets.xcassets as `<name>-poster` imagesets. They are muted
      # fast-start remuxes. The Higgsfield masters stay in
      # media/higgsfield and are not copied into the app target.
      - path: CMSNApp/Resources
    info:
      path: CMSNApp/Info.plist
      properties:
        # XcodeGen's default plist hard-codes 1.0 / 1, which disagrees with
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION above. Derive both so
        # the archived app and Settings show the same version.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Home screen label. Without this key SpringBoard uses the target
        # name, so the icon reads CMSNApp.
        CFBundleDisplayName: CMSN Performance
        UILaunchScreen: {}
        NSCalendarsUsageDescription: "CMSN checks today's calendar for a scheduled workout (like \"Leg Day\") so it can auto-select your split instead of guessing."
        NSCalendarsFullAccessUsageDescription: "CMSN checks today's calendar for a scheduled workout (like \"Leg Day\") so it can auto-select your split instead of guessing."
        NSCameraUsageDescription: "CMSN uses the camera only to scan food barcodes so you can log meals without typing. Nothing is photographed or stored."
        NSLocationWhenInUseUsageDescription: "CMSN Performance uses your location only while you record a run, to measure distance, pace, and the route. It stops the moment the run ends."
        NSLocationAlwaysAndWhenInUseUsageDescription: "CMSN Performance uses location in the background only during an active run, so a locked screen or a phone call does not cut the route short. It does not track you at any other time."
        NSMotionUsageDescription: "CMSN Performance uses motion during an indoor run to estimate treadmill distance from your steps. It is not read when you are not running."
        NSHealthShareUsageDescription: "CMSN Performance reads heart rate and workouts from Apple Health while you run, so your heart rate can show on the run and a workout is not saved twice."
        NSHealthUpdateUsageDescription: "CMSN Performance saves each finished run to Apple Health — distance, time, energy, and route — so it appears with your other workouts. Nothing is written until you finish a run."
        NSBluetoothAlwaysUsageDescription: "CMSN Performance connects to a heart-rate strap only during a run, and only if you turn the strap option on. It does not scan at any other time."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
          - bluetooth-central
        ITSAppUsesNonExemptEncryption: false
        # Registers the bundled Resources/Fonts/BebasNeue-Regular.ttf (OFL
        # license alongside it in the same folder). Its PostScript name is
        # exactly "BebasNeue-Regular", matching CMSNTypography's
        # Font.custom("BebasNeue-Regular", ...) calls with no further
        # wiring needed.
        UIAppFonts:
          - BebasNeue-Regular.ttf
    # HealthKit is declared in CMSNApp.entitlements. XcodeGen 2.46 does not
    # emit an entitlements file from `capabilities`, so the file is set
    # with CODE_SIGN_ENTITLEMENTS below. The App ID still has to have
    # HealthKit turned on in the Apple developer portal before a signed
    # device build will succeed. StoreKit 2 needs no entitlement key.
    capabilities:
      com.apple.InAppPurchase: {}
    # Embed the watch app. Do not link it: a watchOS application is not
    # an iOS library. XcodeGen puts this in "Embed Watch Content"
    # ($(CONTENTS_FOLDER_PATH)/Watch) because the dependency platform is
    # watchOS. link: false keeps it out of the iOS link phase.
    dependencies:
      - target: CMSNWatchApp
        embed: true
        link: false
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app
        CODE_SIGN_ENTITLEMENTS: CMSNApp/CMSNApp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        # Automatic signing for device and TestFlight archives. The team id
        # lives once, in settings.base above.
        CODE_SIGN_STYLE: Automatic

  CMSNWatchApp:
    # Single-target watch app (Xcode 14+). `application.watchapp2` is the
    # legacy wrapper: Xcode adds CopyAndPreserveArchs to drop a prebuilt
    # binary at CMSNWatchApp.app/CMSNWatchApp, and the Compile Sources
    # link writes that same path. That is the "Multiple commands produce"
    # error. A watchOS `application` only links.
    type: application
    platform: watchOS
    sources:
      - path: CMSNWatchApp
        excludes:
          - "**/*.entitlements"
      - path: Shared
    info:
      path: CMSNWatchApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: CMSN Performance
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.earnyourcmsn.app
        WKBackgroundModes:
          - workout-processing
        UIBackgroundModes:
          - location
          - workout-processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "CMSN Performance uses the watch's location only while you record a run, including when the watch face is down. It stops when the run ends."
        NSLocationAlwaysAndWhenInUseUsageDescription: "CMSN Performance keeps location on only during an active run, so the route continues when your wrist drops. It does not track you at any other time."
        NSMotionUsageDescription: "CMSN Performance uses motion during an indoor run to estimate treadmill distance. It is not read when you are not running."
        NSHealthShareUsageDescription: "CMSN Performance reads heart rate during a run from the watch, and checks Apple Health so a finished run is not saved twice."
        NSHealthUpdateUsageDescription: "CMSN Performance saves the run to Apple Health on this watch when you finish. It syncs to your iPhone afterward."
    # HealthKit entitlement is the file below, not a capabilities entry.
    # XcodeGen 2.46 does not emit entitlements from `capabilities`. The
    # watch App ID needs HealthKit enabled in the developer portal.
    # Embedded in CMSNApp, so it is not installed on its own.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: CMSNWatchApp/CMSNWatchApp.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        # Correct standard practice for a target embedded in a host app
        # (kept even though it wasn't what actually fixed CI - see
        # CMSNApp's dependencies comment above for the real fix).
        SKIP_INSTALL: YES

  CMSNAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CMSNAppTests
    dependencies:
      - target: CMSNApp
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.tests
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - CMSNAppTests
      gatherCoverageData: true

  # Screenshot harness only. Kept off the CMSNApp scheme so the unsigned
  # unit-test step (CODE_SIGNING_ALLOWED=NO) does not have to install a
  # UI-test runner. CI runs it from the CMSNScreenshots scheme.
  CMSNAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CMSNAppUITests
    dependencies:
      - target: CMSNApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.earnyourcmsn.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CMSNApp

schemes:
  CMSNWatchApp:
    build:
      targets:
        CMSNWatchApp: all
    run:
      config: Debug

  CMSNApp:
    build:
      targets:
        CMSNApp: all
        CMSNAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CMSNAppTests
      gatherCoverageData: true

  CMSNScreenshots:
    build:
      targets:
        CMSNApp: all
        CMSNAppUITests: [test]
    # Launch the app under test without LLDB. Xcode 26 on the hosted
    # runner intermittently fails DebuggerVersionStore ("no debugger
    # version") and the UI test then times out spawning the app.
    run:
      config: Debug
      debugEnabled: false
    test:
      config: Debug
      debugEnabled: false
      targets:
        - CMSNAppUITests
      environmentVariables:
        # Fixed path so the macOS test runner (not the simulator) can drop
        # PNGs somewhere the workflow can upload.
        - variable: CMSN_SCREENSHOT_DIR
          value: /tmp/cmsn-screenshots
          isEnabled: true

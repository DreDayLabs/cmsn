name: iOS Build

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch: {}

jobs:
  build-and-test:
    # GitHub-hosted macOS runners ship Xcode preinstalled — this is the real
    # Apple toolchain, not a simulation of it. This is the actual answer to
    # "does ios/CMSNApp compile," run on infrastructure neither the agent
    # session nor the developer's own machine needs to provide.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest available Xcode
        # Homebrew's xcodegen generates project files at whatever pbxproj
        # object version its own build was compiled against, which can be
        # newer than this runner's *default* selected Xcode understands
        # ("future Xcode project file format" errors). Runner images ship
        # several Xcode versions side by side under /Applications — pick
        # the newest one instead of trusting the default.
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/CMSNApp
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build (generic iOS Simulator destination)
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project CMSNApp.xcodeproj \
            -scheme CMSNApp \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/CMSNApp/build.log

      - name: Run unit tests
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project CMSNApp.xcodeproj \
            -scheme CMSNApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipMacroValidation \
            | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ios/CMSNApp/test.log

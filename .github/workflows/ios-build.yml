name: iOS Build

on:
  push:
    branches:
      - "claude/**"
      - main
  workflow_dispatch: {}

# Pinned, not "latest": macos-latest and a runtime "pick the newest Xcode"
# script both drift silently as GitHub updates its images, which is exactly
# what caused the first two failures here (an unreadable pbxproj format,
# then a stale mental model of what's installed). Pinning trades "always
# current" for "always reproducible" — bump these deliberately, on purpose,
# when there's a reason to.
env:
  XCODE_VERSION: "26.6"
  XCODE_APP_PATH: "/Applications/Xcode_26.6.app"
  XCODEGEN_VERSION: "2.46.0"

jobs:
  build-and-test:
    runs-on: macos-26-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          if [ ! -d "$XCODE_APP_PATH" ]; then
            echo "::error::Pinned Xcode not found at $XCODE_APP_PATH on this runner image."
            echo "Available Xcode installs:"
            ls -d /Applications/Xcode*.app
            echo "Update XCODE_VERSION/XCODE_APP_PATH at the top of this workflow to match, deliberately."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP_PATH"
          xcodebuild -version

      - name: Install pinned XcodeGen (via Mint)
        # Mint builds/installs an exact tagged version, unlike `brew install
        # xcodegen` which tracks whatever Homebrew currently bottles.
        run: |
          brew install mint
          mint install yonaskolb/xcodegen@$XCODEGEN_VERSION
          echo "$HOME/.mint/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: ios/CMSNApp
        run: |
          xcodegen version
          xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build (concrete simulator destination, unsigned)
        # A *generic* simulator destination left the CMSNWatchApp target's
        # architecture unresolved, and Xcode tried to build both arm64 and
        # x86_64 slices into one universal binary for the same output path
        # ("Multiple commands produce ... CreateUniversalBinary"). A
        # concrete simulator pins it to one architecture. CODE_SIGNING_*
        # overrides make "no signing required for a simulator build"
        # explicit rather than assumed.
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project CMSNApp.xcodeproj \
            -scheme CMSNApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/CMSNApp/build.log

      - name: Run unit tests
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project CMSNApp.xcodeproj \
            -scheme CMSNApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ios/CMSNApp/test.log

name: iOS Build

on:
  push:
    branches:
      - "claude/**"
      - main
      - "codex/**"
  pull_request:
    branches:
      - main
      # Stacked drafts target cursor/* branches. Those PRs need this
      # build, which previously ran only for PRs into main.
      - "cursor/**"
  workflow_dispatch: {}

# Runner image: GitHub only publishes a small, fixed set of macOS labels
# (macos-13/14/15/latest, etc.) for hosted runners — the "macos-26-arm64"
# seen in earlier logs was the runner's *internal* image name, not a
# selectable label (confirmed: a job requesting that label sat in `queued`
# indefinitely instead of picking up a runner within seconds like every
# other run here). So `runs-on` stays macos-latest, the only thing GitHub
# actually lets us request. What's fully pinned instead, deliberately, is
# what determines actual build behavior: the exact Xcode install and the
# exact XcodeGen version, both hard-failing loudly if they drift rather
# than silently picking "whatever's newest" (which caused two of the
# earlier failures here).
env:
  XCODE_VERSION: "26.6"
  XCODE_APP_PATH: "/Applications/Xcode_26.6.app"
  XCODEGEN_VERSION: "2.46.0"

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        run: |
          if [ ! -d "$XCODE_APP_PATH" ]; then
            echo "::error::Pinned Xcode not found at $XCODE_APP_PATH on this runner image."
            echo "Available Xcode installs:"
            ls -d /Applications/Xcode*.app
            echo "Update XCODE_VERSION/XCODE_APP_PATH at the top of this workflow to match, deliberately."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP_PATH"
          xcodebuild -version

      - name: Install pinned XcodeGen (via Mint)
        # Mint builds/installs an exact tagged version, unlike `brew install
        # xcodegen` which tracks whatever Homebrew currently bottles.
        run: |
          brew install mint
          mint install yonaskolb/xcodegen@$XCODEGEN_VERSION
          echo "$HOME/.mint/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        working-directory: ios/CMSNApp
        run: |
          xcodegen version
          xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Build (concrete simulator destination, unsigned)
        # -destination pins a concrete simulator + arch (removes the
        # "multiple matching destinations" arm64/x86_64 ambiguity warning).
        # The actual "Multiple commands produce ... CreateUniversalBinary"
        # build failure this project hit turned out to be unrelated to the
        # destination string - it's fixed in project.yml via
        # EXCLUDED_ARCHS[sdk=...simulator*]=x86_64, since these runners are
        # arm64 and never need the x86_64 simulator slice at all.
        # CODE_SIGNING_* overrides make "no signing required for a
        # simulator build" explicit rather than assumed.
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project CMSNApp.xcodeproj \
            -scheme CMSNApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/CMSNApp/build.log

      - name: Run unit tests
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          xcodebuild test \
            -project CMSNApp.xcodeproj \
            -scheme CMSNApp \
            -destination 'platform=iOS Simulator,name=iPhone 17,arch=arm64' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ios/CMSNApp/test.log

      # Separate from the unsigned unit-test step. The UI-test runner needs
      # an ad-hoc signature to install in the simulator; the app itself is
      # still not signed with a development team. CMSNScreenshots is not
      # part of the CMSNApp scheme, so a failure here is this step alone.
      #
      # The harness used to time out launching the app ("Timed out while
      # launching application via Xcode", sometimes after "could not tap").
      # A cold or half-booted simulator is the usual cause, so this boots
      # iPhone 17 until bootstatus succeeds, targets that booted UDID, and
      # reboots once and reruns the harness if the first pass fails.
      - name: Capture main-screen screenshots
        working-directory: ios/CMSNApp
        run: |
          set -o pipefail
          rm -rf ScreenshotResults.xcresult screenshots /tmp/cmsn-screenshots screenshot.log
          mkdir -p screenshots /tmp/cmsn-screenshots

          boot_iphone17() {
            local attempt
            for attempt in 1 2 3; do
              echo "Booting iPhone 17 (attempt ${attempt}/3)"
              xcrun simctl shutdown "iPhone 17" >/dev/null 2>&1 || true
              if xcrun simctl boot "iPhone 17" && xcrun simctl bootstatus "iPhone 17" -b; then
                xcrun simctl ui "iPhone 17" appearance dark || true
                return 0
              fi
              echo "iPhone 17 was not ready after boot attempt ${attempt}"
              sleep $((attempt * 5))
            done
            echo "iPhone 17 did not finish booting after 3 attempts"
            xcrun simctl list devices available
            return 1
          }

          booted_udid() {
            xcrun simctl list devices \
              | awk '/iPhone 17 / && /Booted/ { print }' \
              | head -1 \
              | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/'
          }

          capture_once() {
            local udid="$1"
            rm -rf ScreenshotResults.xcresult
            xcodebuild test \
              -project CMSNApp.xcodeproj \
              -scheme CMSNScreenshots \
              -destination "platform=iOS Simulator,id=${udid}" \
              -skipMacroValidation \
              -parallel-testing-enabled NO \
              -collect-test-diagnostics never \
              -resultBundlePath "$PWD/ScreenshotResults.xcresult" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_REQUIRED=NO \
              | tee -a screenshot.log
          }

          boot_iphone17
          UDID="$(booted_udid)"
          if [ -z "$UDID" ]; then
            echo "No booted iPhone 17 UDID after bootstatus"
            xcrun simctl list devices
            exit 1
          fi
          echo "Screenshot destination: ${UDID}"

          capture_status=0
          if ! capture_once "$UDID"; then
            echo "Screenshot harness failed. Rebooting iPhone 17 and retrying once."
            boot_iphone17
            UDID="$(booted_udid)"
            if [ -z "$UDID" ]; then
              echo "No booted iPhone 17 UDID after the retry boot"
              exit 1
            fi
            capture_once "$UDID" || capture_status=$?
          fi

          # xcresulttool's export verb moved in newer Xcodes; try the
          # current form, then collect any PNGs the test wrote directly.
          xcrun xcresulttool export attachments \
            --path "$PWD/ScreenshotResults.xcresult" \
            --output-path "$PWD/screenshots/attachments" \
            || true
          cp -f /tmp/cmsn-screenshots/*.png "$PWD/screenshots/" 2>/dev/null || true
          find "$PWD/screenshots" /tmp/cmsn-screenshots "$PWD/ScreenshotResults.xcresult" -name '*.png' -print
          exit "$capture_status"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ios/CMSNApp/screenshots
            ios/CMSNApp/screenshot.log
            ios/CMSNApp/ScreenshotResults.xcresult
